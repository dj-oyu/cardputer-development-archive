# Private local configuration for this Cardputer ADV development environment.
# Every value/action is explicit. This file contains paths, not credentials.
# Command selectors use the first already-active PATH tool; path selectors are explicit.
# No fallback, PATH changes, activation or installation is performed.
schema = 'cardputer-build-v3'

[source]
repo = 'C:\devs\m5stack\cardputer-adv-pocketjs'
commit = '1b4524e3db8524365f58e8c7fb56531c31b55e22'
remote_url = 'https://github.com/dj-oyu/cardputer-adv-pocketjs.git'

[output]
run_root = 'C:\devs\m5stack\pocketjs-main-validation\1b4524e'

[idf]
path = 'C:\esp\v6.0.1\esp-idf'
python_path = 'C:\Espressif\tools\python\v6.0.1\venv\Scripts\python.exe'
# The installation's tools root has not been independently established.
# Select its exact active value explicitly; missing/mismatched values fail.
tools_path_mode = 'environment'
tools_path_value = 'IDF_TOOLS_PATH'

[tools.git]
mode = 'command'
value = 'git'

[tools.node]
# Observed via where.exe node; POCKET_NODE binds this path even when Volta is first.
# Plan checks this executable's version (>=16); an unusable path stops, never falls back.
mode = 'path'
value = 'C:\Program Files\nodejs\node.exe'

[tools.cmake]
mode = 'command'
value = 'cmake'

[tools.ninja]
mode = 'command'
value = 'ninja'

[tools.compiler]
mode = 'path'
value = 'C:\Espressif\tools\xtensa-esp-elf\esp-15.2.0_20251204\xtensa-esp-elf\bin\xtensa-esp32s3-elf-gcc.exe'

[actions]
# If the selected commit is missing, plan reports it and execution stops.
# Change this explicitly to true if you authorize downloading that exact SHA.
fetch_source = false
# Fresh worktree dependency downloads/IDF preparation are explicitly authorized
# only when this config is run with -Execute. Plan-only never downloads.
prepare_dependencies = true
